name = "fridge-scanner-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Any Gemini model with image input that is on the free tier.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Comma-separated list of origins allowed to call this API from a browser.
ALLOWED_ORIGINS = "https://prestoj01.github.io,http://localhost:5173,http://localhost:4173"

# Rate limits (free on every plan). Each namespace_id just needs to be a
# unique number within your account. Period is 10 or 60 seconds.
[[ratelimits]]
name = "CLIENT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "DETECT_LIMITER"
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# Everyone together. Keeps the app under the Gemini free-tier request rate.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# The API key is a secret, not a var. Set it with:
#   npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
# For local development, copy worker/.dev.vars.example to worker/.dev.vars.
