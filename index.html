<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Snap a photo of your fridge or pantry and get healthy recipes you can cook right now."
    />
    <meta name="apple-mobile-web-app-title" content="Fridge Scanner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fridge Scanner</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('fridge-scanner-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
